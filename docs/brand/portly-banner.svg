<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-label="Portly">
  <!-- The website banner: the lighthouse's beam sweeping across the harbor under the wordmark.
       The wordmark and tagline are live text in Fredoka (SemiBold and Medium): install Fredoka
       (Google Fonts, OFL) or outline the text before using this file outside a browser. The site
       pages carry this drawing inline, so it uses their self-hosted Fredoka. -->
  <defs>
    <linearGradient id="banner-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f63"/>
      <stop offset="1" stop-color="#072f3b"/>
    </linearGradient>
    <linearGradient id="banner-beam" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="200" fill="url(#banner-sky)"/>
  <path d="M150 62 960 10v140z" fill="url(#banner-beam)" opacity=".55"/>
  <path d="M118 62 0 30v66z" fill="#ffd166" opacity=".14"/>
  <g transform="translate(70 22) scale(2.6)">
    <path d="M25.5 52l3-28h7l3 28z" fill="#fff"/>
    <path d="M27.75 31h8.5l.43 4h-9.36zm-1.07 10h10.64l.43 4H26.25z" fill="#e3a82b"/>
    <rect x="30.5" y="47" width="3" height="5" rx="1.5" fill="#0b4f63"/>
    <rect x="26.5" y="22.5" width="11" height="2.5" rx="1" fill="#e3a82b"/>
    <rect x="29" y="16" width="6" height="6.5" rx="1" fill="#ffd166"/>
    <path d="M28 16l4-5 4 5z" fill="#e3a82b"/>
    <circle cx="32" cy="10.5" r="1.2" fill="#e3a82b"/>
  </g>
  <rect y="157" width="960" height="43" fill="#137a85"/>
  <path d="M0 160q20-8 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0" fill="none" stroke="#a6dedb" stroke-width="4" stroke-linecap="round"/>
  <text x="290" y="100" font-family="Fredoka, 'Segoe UI', sans-serif" font-weight="600" font-size="84" fill="#fff">portly</text>
  <text class="tagline" x="294" y="138" font-family="Fredoka, 'Segoe UI', sans-serif" font-weight="500" font-size="20" fill="#a6dedb">The steady light in every new tab</text>
</svg>
