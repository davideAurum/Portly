<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Portly">
  <!-- portly-icon.svg with the light making one full turn, then settling on the still icon.
       The right-hand beam swings toward the viewer (passing in front of the tower, with a flash
       as it faces you), round to the left, then behind the tower and back. Plays once, about
       3 s; with reduced motion it shows the still icon. -->
  <style>
    .beam { transform-origin: 32px 19px; animation: turn 2.8s .2s linear both; }
    .front { opacity: 0; animation-name: turn, front; }
    .left { animation: left 2.8s .2s linear both; }
    .flash { opacity: 0; animation: flash 2.8s .2s ease-in-out both; }
    @keyframes turn {
      0%, 6% { transform: scaleX(1); }
      13% { transform: scaleX(.866); }
      20% { transform: scaleX(.5); }
      27% { transform: scaleX(0); }
      34% { transform: scaleX(-.5); }
      41% { transform: scaleX(-.866); }
      48% { transform: scaleX(-1); }
      55% { transform: scaleX(-.866); }
      62% { transform: scaleX(-.5); }
      69% { transform: scaleX(0); }
      76% { transform: scaleX(.5); }
      83% { transform: scaleX(.866); }
      90%, 100% { transform: scaleX(1); }
    }
    @keyframes front { 0%, 47.9% { opacity: 1; } 48%, 100% { opacity: 0; } }
    .back { animation-name: turn, back; }
    @keyframes back { 0%, 47.9% { opacity: 0; } 48%, 100% { opacity: 1; } }
    @keyframes left { 0% { opacity: 1; } 6%, 90% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes flash { 0%, 16% { opacity: 0; } 27% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .beam, .left, .flash { animation: none; }
    }
  </style>
  <defs>
    <path id="beam" d="M35 19l23-8v16z" fill="#ffd166" fill-opacity=".3"/>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#ffd166" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b4f63"/>
  <path class="left" d="M29 19 6 11v16z" fill="#ffd166" fill-opacity=".3"/>
  <use class="beam back" href="#beam"/>
  <path d="M25.5 52l3-28h7l3 28z" fill="#fff"/>
  <path d="M27.75 31h8.5l.43 4h-9.36zm-1.07 10h10.64l.43 4H26.25z" fill="#e3a82b"/>
  <rect x="30.5" y="47" width="3" height="5" rx="1.5" fill="#0b4f63"/>
  <use class="beam front" href="#beam"/>
  <rect x="26.5" y="22.5" width="11" height="2.5" rx="1" fill="#e3a82b"/>
  <rect x="29" y="16" width="6" height="6.5" rx="1" fill="#ffd166"/>
  <path d="M28 16l4-5 4 5z" fill="#e3a82b"/>
  <circle cx="32" cy="10.5" r="1.2" fill="#e3a82b"/>
  <circle class="flash" cx="32" cy="19.25" r="14" fill="url(#glow)"/>
  <rect x="16" y="52" width="32" height="3.5" rx="1.75" fill="#137a85"/>
  <path d="M12 58q5-2 10 0t10 0 10 0 10 0" fill="none" stroke="#a6dedb" stroke-width="2" stroke-linecap="round"/>
</svg>
