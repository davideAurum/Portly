# Builds the Windows release package (scripts/build-release.ps1: the server, the web build, the
# extension, the user scripts, production dependencies and the pinned Node.js runtime in one zip),
# checks it end to end (scripts/check-release.ps1: install, start, update in a temporary folder)
# and keeps it as a workflow artifact. With "publish" ticked it also publishes it to the public
# releases repository (scripts/publish-release.ps1), where install.ps1 and `homebase --update`
# find it.
#
# Manual only: Actions -> "Release" -> Run workflow, on the commit to release (bump the version in
# package.json first; a version can be published once). Publishing needs the RELEASES_TOKEN
# secret: a fine-grained personal access token with access to the releases repository only and
# "Contents: Read and write" (GITHUB_TOKEN cannot write to another repository). Steps:
# docs/setup/releases.md.
#
# Actions are pinned to full commit SHAs with their version as a comment (scripts\check-scripts.ps1
# checks this); see static-pages.yml for how to upgrade one.

name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the releases repository (needs the RELEASES_TOKEN secret). Unticked: build, check and keep the package as an artifact only.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, check and (optionally) publish the release package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: npm 11.10 or newer
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          if ([version](npm -v) -lt [version]'11.10.0') { npm install -g npm@11 --no-audit --no-fund }
          npm -v

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build the release package (downloads the pinned Node.js runtime)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1

      - name: Check the package (install, start, update in a temporary folder)
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -LiteralPath dist-release -Filter 'homebase-*-win-x64.zip' -File)[0].FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\check-release.ps1 -ZipPath $zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebase-release
          path: |
            dist-release/homebase-*-win-x64.zip
            dist-release/homebase-release.json
          if-no-files-found: error

      - name: Publish to the releases repository
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Output '::error::Set the RELEASES_TOKEN secret first (docs/setup/releases.md).'; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\publish-release.ps1
